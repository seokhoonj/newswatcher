[build-system]
# Cap <1.32: hatchling 1.32 emits Metadata-Version 2.5, which the twine bundled in the pinned
# PyPI-publish action rejects (pypa/twine#1327). 2.4 is accepted by PyPI and that twine; the
# 1.27 floor is PEP 639 (the SPDX license expression and license-files). Lift once twine updates.
requires      = ["hatchling>=1.27,<1.32"]
build-backend = "hatchling.build"

[project]
name            = "newswatcher"
version         = "0.2.0"
description     = "Collect topic-matched articles from RSS and robots-permitted crawl sources, summarize them, and mail a digest."
readme          = "README.md"
license         = "MIT"
license-files   = ["LICENSE"]
authors         = [{ name = "Seokhoon Joo", email = "seokhoonj@gmail.com" }]
keywords        = ["news", "rss", "crawl", "watch", "digest", "topics", "email"]
classifiers     = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet",
    "Topic :: Communications :: Email",
    "Typing :: Typed",
]
requires-python = ">=3.11"
dependencies    = [
    "beautifulsoup4>=4.12",
    "credbox>=0.4.0,<0.5",
    "feedparser>=6.0",
    "lxml>=5.0",
    "requests>=2.31",
    "soupsieve>=2.4",
    "thinchat>=0.3.1,<0.4",
    "trafilatura>=1.8",
]

[project.urls]
Homepage   = "https://github.com/seokhoonj/newswatcher"
Repository = "https://github.com/seokhoonj/newswatcher"
Issues     = "https://github.com/seokhoonj/newswatcher/issues"

[project.optional-dependencies]
# Delivery is opt-in: the core (collect -> summarize -> archive) needs neither. Install the
# channel you want -- newswatcher[email] for the mailmail email digest, newswatcher[chat] for the
# pushpush chat digest, or newswatcher[all] for both.
email = ["mailmail>=0.4.2"]
chat = ["pushpush>=0.3.1"]
all = ["newswatcher[email,chat]"]

[dependency-groups]
# Dev tooling plus both delivery packages, so the suite exercises email and chat. A group
# (PEP 735), not a published extra, so it never appears in the distribution's Provides-Extra.
dev = [
    "mailmail>=0.4.2",
    "pushpush>=0.3.1",
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
    "types-requests",
]

[project.scripts]
newswatcher = "newswatcher.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/newswatcher"]

[tool.ruff]
line-length    = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
check_untyped_defs = true

# Third-party packages without type stubs.
[[tool.mypy.overrides]]
module = ["feedparser", "trafilatura", "bs4"]
ignore_missing_imports = true

# These two modules carry a POSIX branch and a Windows branch, and typeshed only reveals
# the host's own (fcntl vs msvcrt; ctypes.windll). Both branches therefore need an ignore
# and one of them is always unused, so type-checking on either OS means not warning here.
[[tool.mypy.overrides]]
module = ["newswatcher.lock", "newswatcher.schedule"]
warn_unused_ignores = false
